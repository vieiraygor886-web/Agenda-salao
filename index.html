<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf6f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Agenda do Salão</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="view-home">
    <div class="home-topo">
      <div class="home-marca">✦</div>
      <h1>Salão</h1>
      <p>Selecione o profissional</p>
    </div>
    <div class="home-cards">
      <button class="card-prof" data-prof="filipe">
        <span>Filipe</span>
      </button>
      <button class="card-prof" data-prof="roseli">
        <span>Roseli</span>
      </button>
    </div>
  </div>

  <!-- TELA DA AGENDA -->
  <div id="view-agenda" hidden>
    <header class="agenda-header">
      <button id="btn-voltar" type="button">←</button>
      <h2 id="agenda-nome"></h2>
      <button id="btn-hoje" type="button">Hoje</button>
    </header>

    <div class="barra-busca">
      <input id="campo-busca" type="search" placeholder="Buscar cliente…" autocomplete="off" />
      <button id="btn-limpar-busca" type="button" hidden>✕</button>
    </div>

    <div id="bloco-semana">
      <div class="semana-nav">
        <button id="btn-anterior" type="button">‹</button>
        <span id="semana-rotulo"></span>
        <button id="btn-seguinte" type="button">›</button>
      </div>
      <div id="faixa-dias"></div>
      <div class="vis-toggle">
        <button id="btn-vis-semana" class="vis-btn ativo" type="button">Semana</button>
        <button id="btn-vis-mes" class="vis-btn" type="button">Mês</button>
      </div>
      <div id="grade-mes" hidden></div>
    </div>

    <div class="lista-secao">
      <h3 id="lista-titulo"></h3>
      <div id="lista-agendamentos"></div>
      <div id="estado-vazio" hidden><p></p></div>
    </div>

    <button id="btn-novo" type="button">+</button>
  </div>

  <!-- PAINEL: FORMULÁRIO -->
  <div id="painel-form" hidden>
    <div class="painel-fundo" id="fundo-form"></div>
    <div class="painel-conteudo" id="conteudo-form">
      <div class="painel-topo">
        <h3 id="form-titulo">Novo agendamento</h3>
        <button id="btn-fechar-form" type="button" class="btn-icon">✕</button>
      </div>

      <!-- Info da cliente (aparece ao identificar pelo tel) -->
      <div id="info-cliente" hidden>
        <div class="cliente-card">
          <div class="cliente-inicial" id="cliente-inicial-letra"></div>
          <div>
            <div class="cliente-card-nome" id="cliente-card-nome"></div>
            <div class="cliente-card-sub" id="cliente-card-sub"></div>
          </div>
        </div>
      </div>

      <form id="form-agendamento" novalidate>
        <div class="form-linha">
          <div class="form-grupo">
            <label>Data *</label>
            <input id="campo-data" type="date" required />
          </div>
          <div class="form-grupo">
            <label>Horário *</label>
            <input id="campo-horario" type="time" required />
          </div>
        </div>

        <div class="form-grupo">
          <label>Telefone (WhatsApp)</label>
          <input id="campo-telefone" type="tel" placeholder="(11) 99999-9999" inputmode="numeric" />
        </div>

        <div class="form-grupo">
          <label>Nome da cliente *</label>
          <input id="campo-cliente" type="text" placeholder="Ex: Maria Silva" required />
        </div>

        <div class="form-grupo">
          <label>Serviço (opcional)</label>
          <input id="campo-servico" type="text" placeholder="Ex: Escova, corte, hidratação…" />
        </div>

        <div class="form-grupo">
          <label class="label-check">
            <input id="campo-tem-pacote" type="checkbox" />
            Cliente tem pacote mensal
          </label>
        </div>

        <div id="secao-pacote" hidden>
          <div class="form-grupo">
            <label>Descrição do pacote</label>
            <input id="campo-pacote-desc" type="text" placeholder="Ex: Escova semanal" />
          </div>
          <div class="form-grupo">
            <label class="label-check">
              <input id="campo-visita-pacote" type="checkbox" />
              Esta visita é do pacote
            </label>
          </div>
        </div>

        <div class="form-grupo">
          <label>Observação (opcional)</label>
          <textarea id="campo-observacao" rows="2" placeholder="Alergia, preferências…"></textarea>
        </div>

        <div class="form-acoes">
          <button type="button" id="btn-excluir-do-form" class="btn-perigo" hidden>Excluir</button>
          <button type="button" id="btn-cancelar-form" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PAINEL: CONFIRMAR EXCLUSÃO -->
  <div id="painel-confirmar" hidden>
    <div class="painel-fundo" id="fundo-confirmar"></div>
    <div class="painel-conteudo painel-centro">
      <h3>Excluir agendamento?</h3>
      <p id="confirmar-texto"></p>
      <div class="form-acoes" style="margin-top:1.25rem">
        <button type="button" id="btn-cancelar-excluir" class="btn-secundario">Cancelar</button>
        <button type="button" id="btn-confirmar-excluir" class="btn-perigo" style="margin-right:0">Excluir</button>
      </div>
    </div>
  </div>

  <!-- PAINEL: HISTÓRICO DA CLIENTE -->
  <div id="painel-historico" hidden>
    <div class="painel-fundo" id="fundo-historico"></div>
    <div class="painel-conteudo">
      <div class="painel-topo">
        <h3 id="historico-titulo">Histórico</h3>
        <button id="btn-fechar-historico" type="button" class="btn-icon">✕</button>
      </div>
      <div id="historico-conteudo"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
