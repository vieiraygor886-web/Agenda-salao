<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5ede4" />
  <title>Agenda do Salão</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="view-home">
    <header class="home-header">
      <div class="home-logo">✂️</div>
      <h1>Agenda do Salão</h1>
      <p>Escolha o profissional</p>
    </header>
    <div class="home-botoes">
      <button class="btn-pessoa" data-prof="filipe">
        <span class="pessoa-icone">✂️</span>
        <span class="pessoa-nome">Filipe</span>
      </button>
      <button class="btn-pessoa" data-prof="roseli">
        <span class="pessoa-icone">💨</span>
        <span class="pessoa-nome">Roseli</span>
      </button>
    </div>
  </div>

  <!-- TELA DA AGENDA -->
  <div id="view-agenda" hidden>
    <header class="agenda-header">
      <button id="btn-voltar">←</button>
      <h2 id="agenda-nome"></h2>
      <button id="btn-hoje">Hoje</button>
    </header>

    <div class="barra-busca">
      <input id="campo-busca" type="search" placeholder="Buscar cliente…" autocomplete="off" />
      <button id="btn-limpar-busca" hidden>✕</button>
    </div>

    <div id="bloco-semana">
      <div class="semana-nav">
        <button id="btn-anterior">‹</button>
        <span id="semana-rotulo"></span>
        <button id="btn-seguinte">›</button>
      </div>
      <div id="faixa-dias"></div>
      <div class="vis-toggle">
        <button id="btn-vis-semana" class="vis-btn ativo">Semana</button>
        <button id="btn-vis-mes" class="vis-btn">Mês</button>
      </div>
      <div id="grade-mes" hidden></div>
    </div>

    <div class="lista-secao">
      <h3 id="lista-titulo"></h3>
      <div id="lista-agendamentos"></div>
      <div id="estado-vazio" hidden><p></p></div>
    </div>

    <button id="btn-novo">＋</button>
  </div>

  <!-- PAINEL LATERAL: FORMULÁRIO -->
  <div id="painel-form" hidden>
    <div class="painel-fundo" id="fundo-form"></div>
    <div class="painel-conteudo">
      <div class="modal-cabecalho">
        <h3 id="form-titulo">Novo agendamento</h3>
        <button id="btn-fechar-form" type="button">✕</button>
      </div>
      <form id="form-agendamento" novalidate>
        <div class="form-linha">
          <div class="form-grupo">
            <label>Data *</label>
            <input id="campo-data" type="date" required />
          </div>
          <div class="form-grupo">
            <label>Horário *</label>
            <input id="campo-horario" type="time" required />
          </div>
        </div>
        <div class="form-grupo">
          <label>Nome da cliente *</label>
          <input id="campo-cliente" type="text" placeholder="Ex: Maria Silva" required />
        </div>
        <div class="form-grupo">
          <label>Telefone (WhatsApp)</label>
          <input id="campo-telefone" type="tel" placeholder="Ex: (11) 99999-9999" />
        </div>
        <div class="form-grupo">
          <label>Serviço (opcional)</label>
          <input id="campo-servico" type="text" placeholder="Ex: Corte, escova…" />
        </div>
        <div class="form-grupo">
          <label class="label-check">
            <input id="campo-tem-pacote" type="checkbox" />
            Cliente tem pacote
          </label>
        </div>
        <div id="secao-pacote" hidden>
          <div class="form-grupo">
            <label>Descrição do pacote</label>
            <input id="campo-pacote-desc" type="text" placeholder="Ex: 4 escovas/mês" />
          </div>
          <div class="form-grupo">
            <label class="label-check">
              <input id="campo-visita-pacote" type="checkbox" />
              Esta visita é do pacote
            </label>
          </div>
        </div>
        <div class="form-grupo">
          <label>Observação (opcional)</label>
          <textarea id="campo-observacao" rows="2" placeholder="Ex: alergia, preferências…"></textarea>
        </div>
        <div class="form-acoes">
          <button type="button" id="btn-excluir-do-form" class="btn-perigo" hidden>Excluir</button>
          <button type="button" id="btn-cancelar-form" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PAINEL LATERAL: CONFIRMAR EXCLUSÃO -->
  <div id="painel-confirmar" hidden>
    <div class="painel-fundo" id="fundo-confirmar"></div>
    <div class="painel-conteudo painel-pequeno">
      <h3>Excluir agendamento?</h3>
      <p id="confirmar-texto" style="margin:.75rem 0;font-size:.9rem;color:#9c7b68;line-height:1.5"></p>
      <div class="form-acoes">
        <button type="button" id="btn-cancelar-excluir" class="btn-secundario">Cancelar</button>
        <button type="button" id="btn-confirmar-excluir" class="btn-perigo">Excluir</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
